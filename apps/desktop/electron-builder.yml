# Installers for Cot Desktop. The main process is one bundled file, so only
# the build output and resources ship (no node_modules).
appId: com.cot.desktop
productName: Cot Desktop
directories:
  output: release
files:
  - out/**
  - resources/**
  - package.json
mac:
  category: public.app-category.productivity
  target: [dmg]
  icon: resources/icon.png
  # Shown by macOS the first time the assistant reads or edits the calendar.
  extendInfo:
    NSCalendarsUsageDescription: Cot Desktop lets your assistant read and add calendar events.
    NSRemindersUsageDescription: Cot Desktop lets your assistant read and add reminders.
    NSAppleEventsUsageDescription: Cot Desktop controls Calendar and Reminders for your assistant.
    LSUIElement: false
win:
  target: [nsis]
  icon: resources/icon.png
linux:
  target: [AppImage]
  category: Utility
  icon: resources/icon.png

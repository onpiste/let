# Lint rules for the iOS app. Formatting is SwiftFormat's job, so the
# style rules it also enforces are off here to avoid fighting it.
included:
  - Cot
  - CotTests
excluded:
  - Cot.xcodeproj
  - build
  - .build

disabled_rules:
  - trailing_comma
  - opening_brace
  - vertical_whitespace
  - trailing_whitespace
  - line_length # SwiftFormat wraps; long strings/URLs are fine
  # `String(decoding:as:)` is the lossy-safe form; the failable one adds nothing.
  - optional_data_string_conversion
  # The reducer, markdown parser and ChatStore are big switches by nature;
  # splitting them without a compiler at hand is riskier than the warning.
  - cyclomatic_complexity
  - function_body_length
  - type_body_length
  - nesting

opt_in_rules:
  - empty_count
  - first_where
  - sorted_first_last
  - fatal_error_message

identifier_name:
  min_length: 1

file_length:
  warning: 300
  error: 500
  ignore_comment_only_lines: true

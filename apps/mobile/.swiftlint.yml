# Lint rules for the iOS app. Formatting is SwiftFormat's job, so the
# style rules it also enforces are off here to avoid fighting it.
included:
  - Cot
  - CotTests
excluded:
  - Cot.xcodeproj
  - build
  - .build

disabled_rules:
  - trailing_comma
  - opening_brace
  - vertical_whitespace
  - trailing_whitespace
  - line_length # SwiftFormat wraps; long strings/URLs are fine

opt_in_rules:
  - empty_count
  - first_where
  - sorted_first_last
  - unused_import
  - force_unwrapping
  - fatal_error_message

# Mirrors the "no non-null `!`" rule on the TypeScript side.
force_unwrapping:
  severity: error

file_length:
  warning: 300
  error: 500
  ignore_comment_only_lines: true

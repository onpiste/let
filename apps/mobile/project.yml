# XcodeGen spec: `xcodegen generate` writes Cot.xcodeproj (gitignored), so new
# Swift files under Cot/ are picked up without editing a .pbxproj.
name: Cot
options:
  bundleIdPrefix: runlet
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    GENERATE_INFOPLIST_FILE: NO
targets:
  Cot:
    type: application
    platform: iOS
    sources:
      - path: Cot
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: runlet.GoodMenu
        PRODUCT_NAME: Cot
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
      # Which APNs gateway the app's tokens belong to; Push.swift tells the
      # server the same thing.
      configs:
        Debug:
          APS_ENVIRONMENT: development
        Release:
          APS_ENVIRONMENT: production
    # Debug only: includes the gitignored Local.xcconfig, which can point the
    # app at a local `bun run dev` server (see Local.xcconfig.example).
    configFiles:
      Debug: Debug.xcconfig
    # Push notifications (APNs). The App ID needs the Push Notifications
    # capability, and a manual provisioning profile must be made after it is
    # turned on (see README.md).
    entitlements:
      path: Cot/Cot.entitlements
      properties:
        aps-environment: $(APS_ENVIRONMENT)
    info:
      path: Cot/Info.plist
      properties:
        CFBundleDisplayName: CotBot
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        NSMicrophoneUsageDescription: Cot records your voice to turn it into text for your message.
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # Your deployment: the Worker's origin (the `routes` pattern in
        # apps/server/wrangler.jsonc). Read by Cot/Config.swift.
        CotServerURL: https://runlet.us
        # Debug builds only: host:port of a local dev server, from
        # Local.xcconfig. Empty means CotServerURL.
        CotDevServer: $(COT_DEV_SERVER)
        # Plain HTTP to localhost and .local hosts, for that dev server. ATS
        # still applies to every other host.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        # Native sign-in returns here; must equal NATIVE_REDIRECT_URI in
        # apps/server/wrangler.jsonc.
        CotRedirectURI: cot://auth/callback
        CFBundleURLTypes:
          - CFBundleURLName: $(PRODUCT_BUNDLE_IDENTIFIER)
            CFBundleURLSchemes: [cot]
  CotTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: CotTests
    dependencies:
      - target: Cot
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: runlet.GoodMenu.tests
schemes:
  Cot:
    build:
      targets:
        Cot: all
    test:
      targets:
        - CotTests

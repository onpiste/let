name: Desktop

# Builds the Cot Desktop installers on each OS. Run it by hand (Actions → Desktop
# → Run workflow) or push a tag like desktop-v0.1.0. The installers are not
# signed or notarized; see apps/desktop/README.md.
on:
  workflow_dispatch:
  push:
    tags:
      - "desktop-v*"

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2025, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - run: bun install --frozen-lockfile
      - run: bun run --filter @cot/desktop package
        env:
          # Skip signing: no certificates are configured.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - uses: actions/upload-artifact@v4
        with:
          name: cot-desktop-${{ matrix.os }}
          path: |
            apps/desktop/release/*.dmg
            apps/desktop/release/*.exe
            apps/desktop/release/*.AppImage

name: Deploy

# Every push to main is checked and deployed to Cloudflare (runlet.us).
# Needs the CLOUDFLARE_API_TOKEN repository secret. Worker secrets
# (GOOGLE_CLIENT_ID etc.) live in Cloudflare and are kept across deploys.
on:
  push:
    branches:
      - main
  workflow_dispatch:

# One deploy at a time; a newer push waits instead of racing the older one.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Failed steps go to the dev logs (scripts/devlog, `bun run logs --source
    # ci`). Without the secret, as on forks, they only fail as usual.
    env:
      DEV_LOGS_TOKEN: ${{ secrets.DEV_LOGS_TOKEN }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - run: bun install --frozen-lockfile
      - run: bun scripts/devlog/index.ts report Check -- bun run check
      - run: bun scripts/devlog/index.ts report Worker types -- bun run --filter @cot/server types:check

      # apps/web: vite build (client + the apps/server Worker) && wrangler
      # deploy. The sandbox uses Cloudflare's managed image, so no Docker is
      # needed here.
      - run: bun scripts/devlog/index.ts report Deploy -- bun run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 02eec653ae3b648ef566c2469e7fb68e

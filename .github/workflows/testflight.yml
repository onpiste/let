name: TestFlight

# Archives the iOS app on a macOS runner, signs it and uploads it to
# TestFlight, so no local Mac is needed. It runs once a day if the iOS app
# changed in the last 24 hours (a cheap Linux job decides, so an idle day costs
# no macOS minutes), or by hand from the Actions tab. With Xcode on a Mac,
# scripts/testflight.sh (or scripts/nightly.sh) does the same for free; then
# remove the schedule.
#
# Always needs these repository secrets (see apps/mobile/README.md):
#   APPLE_TEAM_ID                 10-character Team ID from developer.apple.com
#   APP_STORE_CONNECT_KEY_ID      App Store Connect API key ID
#   APP_STORE_CONNECT_ISSUER_ID   Issuer ID shown above the API keys list
#   APP_STORE_CONNECT_KEY         Contents of the AuthKey_<KEY_ID>.p8 file
#
# Signing: with the three IOS_* secrets below, the build is signed manually
# with one fixed distribution certificate, so it never creates certificates
# and can't hit Apple's certificate limit. Without them it falls back to
# Xcode's automatic (cloud-managed) signing, which creates a certificate per run.
#   IOS_DIST_CERT_P12             base64 of the Apple Distribution .p12
#   IOS_DIST_CERT_PASSWORD        the .p12's password
#   IOS_PROVISIONING_PROFILE      base64 of the App Store .mobileprovision
on:
  workflow_dispatch:
  schedule:
    - cron: "17 13 * * *"

concurrency:
  group: testflight
  cancel-in-progress: false

jobs:
  changed:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 5
    outputs:
      ios: ${{ steps.diff.outputs.ios }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - id: diff
        run: |
          if [ "${{ github.event_name }}" = workflow_dispatch ] ||
            [ -n "$(git log --since='24 hours ago' --format=%H -- apps/mobile)" ]; then
            echo "ios=true" >> "$GITHUB_OUTPUT"
          else
            echo "ios=false" >> "$GITHUB_OUTPUT"
          fi

  upload:
    needs: changed
    if: needs.changed.outputs.ios == 'true'
    # App Store Connect only accepts builds made with the iOS 26 SDK or later
    # (Xcode 26), which macos-15 doesn't have by default.
    runs-on: blacksmith-6vcpu-macos-26
    timeout-minutes: 30
    env:
      TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      MANUAL_SIGNING: ${{ secrets.IOS_DIST_CERT_P12 != '' }}
      BUNDLE_ID: runlet.GoodMenu
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      # Apple raises the minimum SDK every year; use the newest stable Xcode
      # on the image rather than whatever it defaults to.
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - run: brew install xcodegen

      - name: Generate the Xcode project
        working-directory: apps/mobile
        run: xcodegen generate

      - name: Write the App Store Connect API key
        env:
          ASC_KEY: ${{ secrets.APP_STORE_CONNECT_KEY }}
        run: |
          if [ -z "$TEAM_ID" ] || [ -z "$ASC_KEY_ID" ] || [ -z "$ASC_ISSUER_ID" ] || [ -z "$ASC_KEY" ]; then
            echo "::error::Set the APPLE_TEAM_ID and APP_STORE_CONNECT_* secrets first (apps/mobile/README.md)."
            exit 1
          fi
          # Rebuild the PEM from its base64 body, so a paste that lost its
          # line breaks or BEGIN/END lines (or has CRLFs) still works.
          body=$(printf '%s' "$ASC_KEY" | sed -e 's/\\n//g' -e 's/-----[A-Z ]*-----//g' | tr -d ' \r\n\t')
          {
            echo "-----BEGIN PRIVATE KEY-----"
            printf '%s\n' "$body" | fold -w 64
            echo "-----END PRIVATE KEY-----"
          } > "$RUNNER_TEMP/AuthKey.p8"
          if ! openssl pkey -in "$RUNNER_TEMP/AuthKey.p8" -noout 2>/dev/null; then
            echo "::error::APP_STORE_CONNECT_KEY isn't a valid private key. Paste the whole contents of the AuthKey_<KEY_ID>.p8 file."
            exit 1
          fi

      - name: Install the signing certificate and profile
        if: env.MANUAL_SIGNING == 'true'
        env:
          CERT_P12: ${{ secrets.IOS_DIST_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          PROFILE: ${{ secrets.IOS_PROVISIONING_PROFILE }}
        run: |
          if [ -z "$CERT_PASSWORD" ] || [ -z "$PROFILE" ]; then
            echo "::error::Set IOS_DIST_CERT_PASSWORD and IOS_PROVISIONING_PROFILE too (apps/mobile/README.md)."
            exit 1
          fi
          keychain="$RUNNER_TEMP/signing.keychain-db"
          pass=$(uuidgen)
          security create-keychain -p "$pass" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$pass" "$keychain"
          printf '%s' "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/dist.p12"
          security import "$RUNNER_TEMP/dist.p12" -k "$keychain" -P "$CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "$pass" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/dist.p12"

          printf '%s' "$PROFILE" | base64 --decode > "$RUNNER_TEMP/profile.mobileprovision"
          security cms -D -i "$RUNNER_TEMP/profile.mobileprovision" > "$RUNNER_TEMP/profile.plist"
          uuid=$(/usr/libexec/PlistBuddy -c 'Print UUID' "$RUNNER_TEMP/profile.plist")
          name=$(/usr/libexec/PlistBuddy -c 'Print Name' "$RUNNER_TEMP/profile.plist")
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$RUNNER_TEMP/profile.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/$uuid.mobileprovision"
          echo "PROFILE_NAME=$name" >> "$GITHUB_ENV"
          echo "SIGNING_KEYCHAIN=$keychain" >> "$GITHUB_ENV"

      # The build number must grow with every upload; the run number does.
      - name: Archive
        working-directory: apps/mobile
        run: |
          if [ "$MANUAL_SIGNING" = true ]; then
            signing=(
              CODE_SIGN_STYLE=Manual
              "CODE_SIGN_IDENTITY=Apple Distribution"
              "PROVISIONING_PROFILE_SPECIFIER=$PROFILE_NAME"
              "OTHER_CODE_SIGN_FLAGS=--keychain $SIGNING_KEYCHAIN"
            )
          else
            signing=(
              -allowProvisioningUpdates
              -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8"
              -authenticationKeyID "$ASC_KEY_ID"
              -authenticationKeyIssuerID "$ASC_ISSUER_ID"
            )
          fi
          xcodebuild archive \
            -project Cot.xcodeproj \
            -scheme Cot \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            "${signing[@]}"

      # destination=upload sends the signed build straight to App Store
      # Connect, so there's no separate altool step.
      - name: Export and upload
        run: |
          if [ "$MANUAL_SIGNING" = true ]; then
            signing_xml="<key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>provisioningProfiles</key>
            <dict><key>$BUNDLE_ID</key><string>$PROFILE_NAME</string></dict>"
            auth=()
          else
            signing_xml="<key>signingStyle</key><string>automatic</string>"
            auth=(-allowProvisioningUpdates)
          fi
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>destination</key>
            <string>upload</string>
            $signing_xml
            <key>teamID</key>
            <string>$TEAM_ID</string>
            <key>manageAppVersionAndBuildNumber</key>
            <false/>
          </dict>
          </plist>
          EOF
          # The API key is still needed to upload, whichever way it's signed.
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            "${auth[@]}" \
            -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      - name: Clean up signing material
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/AuthKey.p8" "$RUNNER_TEMP/profile.mobileprovision"
          if [ -n "$SIGNING_KEYCHAIN" ]; then security delete-keychain "$SIGNING_KEYCHAIN" || true; fi

name: TestFlight

# Archives the iOS app on a macOS runner, signs it with Xcode's automatic
# (cloud-managed) signing and uploads it to TestFlight, so no local Mac is
# needed. Run it by hand from the Actions tab; web changes reach the app on
# deploy and don't need a new build.
#
# Needs these repository secrets (see apps/mobile/README.md):
#   APPLE_TEAM_ID                 10-character Team ID from developer.apple.com
#   APP_STORE_CONNECT_KEY_ID      App Store Connect API key ID
#   APP_STORE_CONNECT_ISSUER_ID   Issuer ID shown above the API keys list
#   APP_STORE_CONNECT_KEY         Contents of the AuthKey_<KEY_ID>.p8 file
on:
  workflow_dispatch:

concurrency:
  group: testflight
  cancel-in-progress: false

jobs:
  upload:
    runs-on: macos-15
    timeout-minutes: 30
    env:
      TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - run: bun install --frozen-lockfile

      - name: Generate native files
        run: bun run --filter @cot/mobile sync

      - name: Write the App Store Connect API key
        env:
          ASC_KEY: ${{ secrets.APP_STORE_CONNECT_KEY }}
        run: |
          if [ -z "$TEAM_ID" ] || [ -z "$ASC_KEY_ID" ] || [ -z "$ASC_ISSUER_ID" ] || [ -z "$ASC_KEY" ]; then
            echo "::error::Set the APPLE_TEAM_ID and APP_STORE_CONNECT_* secrets first (apps/mobile/README.md)."
            exit 1
          fi
          # Rebuild the PEM from its base64 body, so a paste that lost its
          # line breaks or BEGIN/END lines (or has CRLFs) still works.
          body=$(printf '%s' "$ASC_KEY" | sed -e 's/\\n//g' -e 's/-----[A-Z ]*-----//g' | tr -d ' \r\n\t')
          {
            echo "-----BEGIN PRIVATE KEY-----"
            printf '%s\n' "$body" | fold -w 64
            echo "-----END PRIVATE KEY-----"
          } > "$RUNNER_TEMP/AuthKey.p8"
          if ! openssl pkey -in "$RUNNER_TEMP/AuthKey.p8" -noout 2>/dev/null; then
            echo "::error::APP_STORE_CONNECT_KEY isn't a valid private key. Paste the whole contents of the AuthKey_<KEY_ID>.p8 file."
            exit 1
          fi

      # The build number must grow with every upload; the run number does.
      - name: Archive
        working-directory: apps/mobile/ios/App
        run: >
          xcodebuild archive
          -project App.xcodeproj
          -scheme App
          -configuration Release
          -destination "generic/platform=iOS"
          -archivePath "$RUNNER_TEMP/App.xcarchive"
          -allowProvisioningUpdates
          -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8"
          -authenticationKeyID "$ASC_KEY_ID"
          -authenticationKeyIssuerID "$ASC_ISSUER_ID"
          DEVELOPMENT_TEAM="$TEAM_ID"
          CURRENT_PROJECT_VERSION="${{ github.run_number }}"

      # destination=upload sends the signed build straight to App Store
      # Connect, so there's no separate altool step.
      - name: Export and upload
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>destination</key>
            <string>upload</string>
            <key>signingStyle</key>
            <string>automatic</string>
            <key>teamID</key>
            <string>$TEAM_ID</string>
            <key>manageAppVersionAndBuildNumber</key>
            <false/>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      - name: Remove the API key
        if: always()
        run: rm -f "$RUNNER_TEMP/AuthKey.p8"

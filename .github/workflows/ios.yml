name: iOS

# Builds the native iOS app for the simulator (unsigned) and runs its
# unit tests. Swift can't be built on the Linux runners CI uses for everything
# else. macOS minutes are expensive, so this runs on pull requests only; pushes
# to main are covered by scripts/nightly.sh on a Mac. SwiftFormat/SwiftLint
# are not run here; they are run by hand on a Mac before committing.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "apps/mobile/**"
      - ".github/workflows/ios.yml"

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 20
    # Failed steps go to the dev logs (scripts/devlog, `bun run logs --source
    # ci`). Without the secret, as on forks, they only fail as usual.
    env:
      DEV_LOGS_TOKEN: ${{ secrets.DEV_LOGS_TOKEN }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      # The reporter imports @cot/shared, so the workspace needs installing.
      - run: bun install --frozen-lockfile

      - run: brew install xcodegen

      - name: Generate the Xcode project
        working-directory: apps/mobile
        run: xcodegen generate

      - name: Test on a simulator
        working-directory: apps/mobile
        run: |
          device=$(xcrun simctl list devices available iPhone | grep -m1 -oE '[0-9A-F]{8}-([0-9A-F]{4}-){3}[0-9A-F]{12}')
          bun ../../scripts/devlog/index.ts report "iOS tests" -- xcodebuild test \
            -project Cot.xcodeproj \
            -scheme Cot \
            -destination "id=$device" \
            CODE_SIGNING_ALLOWED=NO

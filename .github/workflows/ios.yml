name: iOS

# Builds the native iOS app for the simulator (unsigned) and runs its unit
# tests. Swift can't be built on the Linux runners CI uses for everything else.
on:
  push:
    branches:
      - main
    paths:
      - "apps/mobile/**"
      - ".github/workflows/ios.yml"
  pull_request:
    paths:
      - "apps/mobile/**"
      - ".github/workflows/ios.yml"

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - run: brew install swiftlint swiftformat

      - name: Format
        working-directory: apps/mobile
        run: swiftformat --lint .

      - name: Lint
        working-directory: apps/mobile
        run: swiftlint lint --strict

  build:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - run: brew install xcodegen

      - name: Generate the Xcode project
        working-directory: apps/mobile
        run: xcodegen generate

      - name: Test on a simulator
        working-directory: apps/mobile
        run: |
          device=$(xcrun simctl list devices available iPhone | grep -m1 -oE '[0-9A-F]{8}-([0-9A-F]{4}-){3}[0-9A-F]{12}')
          xcodebuild test \
            -project Cot.xcodeproj \
            -scheme Cot \
            -destination "id=$device" \
            CODE_SIGNING_ALLOWED=NO

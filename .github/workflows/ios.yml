name: iOS

# Lints the native iOS app, builds it for the simulator (unsigned) and runs its
# unit tests. Swift can't be built on the Linux runners CI uses for everything
# else. macOS minutes are expensive, so this runs on pull requests only; pushes
# to main are covered by the pre-push hook and scripts/nightly.sh on a Mac.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "apps/mobile/**"
      - ".github/workflows/ios.yml"

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # One job, so lint and build share a single (costly) macOS runner.
  build:
    runs-on: blacksmith-6vcpu-macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - run: brew install swiftlint swiftformat xcodegen

      - name: Format
        working-directory: apps/mobile
        run: swiftformat --lint .

      - name: Lint
        working-directory: apps/mobile
        run: swiftlint lint --strict

      - name: Generate the Xcode project
        working-directory: apps/mobile
        run: xcodegen generate

      - name: Test on a simulator
        working-directory: apps/mobile
        run: |
          device=$(xcrun simctl list devices available iPhone | grep -m1 -oE '[0-9A-F]{8}-([0-9A-F]{4}-){3}[0-9A-F]{12}')
          xcodebuild test \
            -project Cot.xcodeproj \
            -scheme Cot \
            -destination "id=$device" \
            CODE_SIGNING_ALLOWED=NO

name: CI

# Checks pull requests. Pushes to main are checked by the Deploy workflow, and
# the desktop build runs locally (scripts/nightly.sh), to save runner minutes.
on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Failed steps go to the dev logs (scripts/devlog, `bun run logs --source
    # ci`). Without the secret, as on forks, they only fail as usual.
    env:
      DEV_LOGS_TOKEN: ${{ secrets.DEV_LOGS_TOKEN }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - run: bun install --frozen-lockfile

      - name: Format
        run: bun scripts/devlog/index.ts report Format -- bun run format:check

      - name: Lint (type-aware, warnings fail)
        run: bun scripts/devlog/index.ts report Lint -- bun run lint

      - name: Typecheck
        run: bun scripts/devlog/index.ts report Typecheck -- bun run typecheck

      - name: Dead code (knip)
        run: bun scripts/devlog/index.ts report Knip -- bun run knip

      - name: Tests
        run: bun scripts/devlog/index.ts report Tests -- bun run test

      - name: Worker types are up to date
        run: bun scripts/devlog/index.ts report Worker types -- bun run --filter @cot/server types:check

      - name: Build
        run: bun scripts/devlog/index.ts report Build -- bun run build

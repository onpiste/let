name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 10
    steps:
      - uses: useblacksmith/checkout@v1
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - run: bun install --frozen-lockfile

      - name: Format
        run: bun run format:check

      - name: Lint (type-aware, warnings fail)
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Dead code (knip)
        run: bun run knip

      - name: Tests
        run: bun run test

      - name: Worker types are up to date
        run: bun run --filter @cot/server types:check

      - name: Build
        run: bun run build

      - name: Build desktop app
        run: bun run --filter @cot/desktop build

name: Watch

# Reads production errors from the dev logs every half hour and files each
# new problem as a `prod-error` issue; one that returns after its issue was
# closed reopens as a `regression` (scripts/ops, docs/adr/0005-release-loop.md).
# Needs the CLOUDFLARE_API_TOKEN repository secret with Workers Observability
# access; without it the run does nothing. ALERT_WEBHOOK_URL (secret) and
# FIX_AGENT_MENTION (variable) are optional.
on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:

concurrency:
  group: watch
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - run: bun install --frozen-lockfile

      - run: bun scripts/ops/index.ts watch
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
          FIX_AGENT_MENTION: ${{ vars.FIX_AGENT_MENTION }}
